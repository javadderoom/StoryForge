services:
  postgres:
    image: postgres:16-alpine
    container_name: storyforge-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: storyforge
    ports:
      - '5432:5432'
    volumes:
      - storyforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storyforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  storyforge_pgdata:
